name: Backend Quality and No-External-API Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  deployment-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup deployment Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile deployment source
        run: >-
          python -m compileall -q
          agents core data_base evaluation graph_rag pdfserviceMD multimodal_rag
          conversations stats image_service main.py supabase_client.py

  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_MODE: "true"
      USE_FAKE_PROVIDERS: "true"
      CI_BLOCK_EXTERNAL_NETWORK: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup quality Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies including Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff correctness
        run: python -m ruff check . --select E9,F63,F7,F82,F401,F841

      - name: Full pytest suite with warning budget
        run: python scripts/run_pytest_with_warning_budget.py --max-warnings 56 -- -q

      - name: OpenAPI drift check
        run: python scripts/sync_openapi_artifacts.py --check

      - name: Markdown link check
        run: python scripts/check_markdown_links.py
